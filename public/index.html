<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pilk Bets">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Pilk Bets</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Overview -->
    <section class="view active" id="view-overview" data-title="Overview">
      <div class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg></div>
      <div class="content">
        <h1 class="large-title reveal" style="--i:0">Overview</h1>
        <div class="hero reveal" style="--i:1">
          <div class="hero-label" id="hero-label">All-time profit</div>
          <div class="hero-value num" id="hero-value">–</div>
          <div class="hero-sub" id="hero-sub"></div>
        </div>
        <div class="segmented reveal" style="--i:2" id="range" role="tablist" aria-label="Time range">
          <div class="thumb"></div>
          <button data-range="7" role="tab">1W</button>
          <button data-range="30" role="tab">1M</button>
          <button data-range="all" role="tab" aria-selected="true">All</button>
        </div>
        <div class="reveal" style="--i:3">
          <div class="chart-wrap" id="chart"></div>
          <div class="chart-axis" id="chart-axis"></div>
        </div>
        <div id="overview-body"></div>
      </div>
    </section>

    <!-- Bets -->
    <section class="view" id="view-bets" data-title="Bets">
      <div class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg></div>
      <div class="content">
        <h1 class="large-title">Bets</h1>
        <p class="subtitle" id="bets-sub"></p>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="bet-search" type="search" placeholder="Team, matchup, sport" autocomplete="off" autocorrect="off" spellcheck="false">
        </label>
        <div class="chips" id="bet-chips"></div>
        <div id="bets-list"></div>
      </div>
    </section>

    <!-- Activity -->
    <section class="view" id="view-activity" data-title="Activity">
      <div class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg></div>
      <div class="content">
        <h1 class="large-title">Activity</h1>
        <p class="subtitle">Every trade, payout, deposit, and withdrawal.</p>
        <div id="activity-body"></div>
      </div>
    </section>

    <!-- Lab -->
    <section class="view" id="view-lab" data-title="Bot Lab">
      <div class="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg></div>
      <div class="content">
        <h1 class="large-title">Bot Lab</h1>
        <p class="subtitle">Test strategies on paper before any real money moves.</p>
        <div id="lab-body"></div>
      </div>
    </section>

    <header class="navbar" id="navbar">
      <span class="small-title" id="small-title">Overview</span>
      <button class="nav-action" id="sync-btn" aria-label="Sync now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg>
      </button>
    </header>

    <nav class="tabbar" id="tabbar" aria-label="Sections">
      <button class="tab active" data-view="overview" aria-label="Overview">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l6-7 4 4 9-11"/><path d="M17 6h5v5"/></svg>
        Overview
      </button>
      <button class="tab" data-view="bets" aria-label="Bets">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="4" width="19" height="18" rx="4"/><path d="M8 10h10M8 14.5h10M8 19h6"/></svg>
        Bets
      </button>
      <button class="tab" data-view="activity" aria-label="Activity">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="9.5"/><path d="M13 7.5V13l3.5 2.5"/></svg>
        Activity
      </button>
      <button class="tab" data-view="lab" aria-label="Bot Lab">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5h6M11 3.5v6.2L5.2 19.6A2 2 0 0 0 7 22.5h12a2 2 0 0 0 1.8-2.9L15 9.7V3.5"/><path d="M7.5 16h11"/></svg>
        Lab
      </button>
    </nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Bet details">
      <div class="sheet-grip"></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
